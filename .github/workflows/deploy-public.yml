name: Deploy to Public Repo

on:
  workflow_dispatch:

env:
  PUBLIC_REPO: xlthimolx/djpult-pwa-puplic

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Push to public repo (overwrite main)
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          rm -rf .github
          git add -A
          git commit -m "Deploy to public" || true
          git push https://x-access-token:${TOKEN}@github.com/${{ env.PUBLIC_REPO }}.git HEAD:main --force

